name: Build and push Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g., v1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate Django and migrations
        env:
          DJANGO_DEBUG: "1"
          TWITCH_FARM_DB: /tmp/twitch-farm-ci.sqlite3
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Validate production security settings
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-security-check-abcdefghijklmnopqrstuvwxyz-0123456789"
          DJANGO_SECURE_COOKIES: "1"
        run: uv run python manage.py check --deploy

      - name: Run tests
        env:
          DJANGO_DEBUG: "1"
        run: uv run pytest -q

      - name: Validate Compose
        env:
          DJANGO_SECRET_KEY: "ci-only-compose-validation-abcdefghijklmnopqrstuvwxyz-0123456789"
        run: docker compose config --quiet

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine tags
        id: tags
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tags=${image_name}:${{ github.ref_name }},${image_name}:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${image_name}:${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          sbom: false
