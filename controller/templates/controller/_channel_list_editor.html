<div class="field" data-channel-list-source>
  <label for="{{ channel_field.id_for_label }}">{{ channel_label|default:"Ordered channels" }}</label>
  {{ channel_field }}
  {% if channel_field.help_text %}<span class="field-help" id="{{ channel_field.id_for_label }}_helptext">{{ channel_field.help_text }}</span>{% endif %}
  {{ channel_field.errors }}
</div>
<div class="preset-channel-editor" data-channel-list-editor data-preset-channel-editor aria-label="{{ channel_label|default:'Ordered channels' }} editor" hidden>
  <div class="preset-channel-add">
    <div class="field">
      <label for="{{ editor_input_id }}">Add channel</label>
      <input id="{{ editor_input_id }}" type="text" autocomplete="off" spellcheck="false" placeholder="channel_name" data-channel-list-input data-preset-channel-input>
    </div>
    <button class="button button--primary" type="button" data-channel-list-add data-preset-channel-add>Add</button>
  </div>
  <p class="field-help" data-channel-list-feedback data-preset-channel-feedback aria-live="polite">New channels append to the end of this list.</p>
  <ol class="preset-channel-list" data-channel-list-items data-preset-channel-list aria-label="{{ list_label|default:'Channels' }}"></ol>
</div>
