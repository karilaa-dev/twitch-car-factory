<div class="field" data-preset-channel-source>
  <label for="{{ form.channels.id_for_label }}">Ordered channels</label>
  {{ form.channels }}
  {% if form.channels.help_text %}<span class="field-help">{{ form.channels.help_text }}</span>{% endif %}
  {{ form.channels.errors }}
</div>
<div class="preset-channel-editor" data-preset-channel-editor hidden>
  <div class="preset-channel-add">
    <div class="field">
      <label for="preset-channel-new">Add channel</label>
      <input id="preset-channel-new" type="text" autocomplete="off" spellcheck="false" placeholder="channel_name" data-preset-channel-input>
    </div>
    <button class="button button--primary" type="button" data-preset-channel-add>Add</button>
  </div>
  <p class="field-help" data-preset-channel-feedback aria-live="polite">New channels append to the end of the preset.</p>
  <ol class="preset-channel-list" data-preset-channel-list aria-label="Preset channels"></ol>
</div>
