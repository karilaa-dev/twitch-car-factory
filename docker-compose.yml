services:
  twitch-car-factory:
    build: .
    image: ghcr.io/karilaa/twitch-car-factory:latest
    container_name: twitch-car-factory
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./cookies:/app/cookies
    environment:
      - TZ=UTC

