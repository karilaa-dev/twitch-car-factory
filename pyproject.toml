[project]
name = "twitch-cat-factory"
version = "2.0.0"
description = "Django control plane for reliable Twitch Channel Points Miner instances"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "cryptography>=49.0.0",
    "django>=6.0.7,<6.1",
    "gunicorn>=26.0.0",
    "pyyaml>=6.0.3",
    "twitch-channel-points-miner-v2>=2.0.7",
    "validators>=0.35.0",
    "whitenoise>=6.12.0",
]

[tool.uv.sources]
twitch-channel-points-miner-v2 = { git = "https://github.com/rdavydov/Twitch-Channel-Points-Miner-v2.git" }

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "twitch_farm.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra"
